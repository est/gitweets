<!DOCTYPE html><html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗯️</text></svg>">
	<title>gitweets</title>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
			-webkit-tap-highlight-color: transparent;
		}

		body {
			font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
			background-color: #ededed;
			color: #191919;
			line-height: 1.4;
			-webkit-font-smoothing: antialiased;
		}

		.container {
			max-width: 414px;
			margin: 0 auto;
			background-color: #ededed;
			min-height: 100vh;
			position: relative;
		}

		/* 顶部导航栏 */
		.nav-bar {
			position: fixed;
			top: 0;
			left: 50%;
			transform: translateX(-50%);
			width: 100%;
			max-width: 414px;
			height: 55px;
			z-index: 1000;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 0 16px;
			transition: background-color 0.3s, color 0.3s;
			background-color: transparent;
		}

		.nav-bar.scrolled {
			background-color: #ededed;
		}

		.nav-bar .back-btn {
			position: absolute;
			left: 12px;
			width: 24px;
			height: 24px;
			cursor: pointer;
			text-decoration: none;
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.nav-bar .back-btn svg,
		.nav-bar .post-btn svg {
			width: 24px;
			height: 24px;
			fill: white;
			transition: fill 0.3s;
		}

		.nav-bar.scrolled .back-btn svg,
		.nav-bar.scrolled .post-btn svg {
			fill: #191919;
		}

		.nav-bar .title {
			font-size: 16px;
			font-weight: 500;
			color: transparent;
			transition: color 0.3s;
		}

		.nav-bar.scrolled .title {
			color: #191919;
		}

		.nav-bar .post-btn {
			position: absolute;
			right: 16px;
			width: 24px;
			height: 24px;
			cursor: pointer;
			background: none;
			border: none;
			padding: 0;
			display: flex;
			align-items: center;
			justify-content: center;
		}

		/* 封面区域 */
		.cover-section {
			position: relative;
			height: 0;
			padding-bottom: 75%;
			overflow: hidden;
			background-color: #c0c0c0;
		}

		.cover-image {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			object-fit: cover;
		}

		.cover-overlay {
			position: absolute;
			bottom: 0;
			left: 0;
			right: 0;
			padding: 20px 16px;
			display: flex;
			align-items: flex-end;
			justify-content: flex-end;
			background: linear-gradient(transparent, rgba(0, 0, 0, 0.3));
		}

		.cover-user-info {
			display: flex;
			align-items: center;
			gap: 12px;
			text-decoration: none;
			color: inherit;
		}

		.cover-username {
			font-size: 18px;
			font-weight: 600;
			color: white;
			text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
		}

		.cover-avatar {
			width: 68px;
			height: 68px;
			border-radius: 8px;
			border: 3px solid white;
			overflow: hidden;
			box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
		}

		.cover-avatar img {
			width: 100%;
			height: 100%;
			object-fit: cover;
		}

		/* 分页指示器 */
		.pagination-indicator {
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 12px 16px;
			background-color: white;
			margin-top: 12px;
			gap: 16px;
		}

		.pagination-indicator .page-btn {
			width: 32px;
			height: 32px;
			border: none;
			background-color: #f5f5f5;
			border-radius: 4px;
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 16px;
			color: #191919;
		}

		.pagination-indicator .page-btn:disabled {
			opacity: 0.4;
			cursor: not-allowed;
		}

		.pagination-indicator .page-btn:hover:not(:disabled) {
			background-color: #e5e5e5;
		}

		.pagination-indicator .page-info {
			font-size: 14px;
			color: #666;
			cursor: pointer;
		}

		.pagination-indicator .page-info:hover {
			color: #333;
		}

		/* 动态列表 */
		.posts-list {
			background-color: white;
			margin-top: 2px;
			padding-bottom: 80px;
		}

		.post-item {
			padding: 12px 16px;
			border-bottom: 1px solid #e5e5e5;
		}

		.post-item:last-child {
			border-bottom: none;
		}

		.post-header {
			display: flex;
			align-items: flex-start;
			margin-bottom: 10px;
		}

		.post-avatar {
			width: 44px;
			height: 44px;
			border-radius: 4px;
			overflow: hidden;
			margin-right: 12px;
			flex-shrink: 0;
		}

		.post-avatar img {
			width: 100%;
			height: 100%;
			object-fit: cover;
		}

		.post-meta {
			flex: 1;
			min-width: 0;
		}

		.post-username {
			font-size: 16px;
			font-weight: 600;
			color: #174b73;
			margin-bottom: 2px;
			word-break: break-word;
		}

		.post-content {
			font-size: 16px;
			line-height: 1.5;
			color: #191919;
			margin-bottom: 10px;
			word-break: break-word;
			white-space: pre-wrap;
		}

		.post-fold {
			display: inline;
		}

		.post-fold summary {
			display: inline;
			color: #174b73;
			cursor: pointer;
		}

		.post-fold summary::marker {
			content: '';
		}

		.post-fold[open] summary {
			display: none;
		}

		.post-location {
			display: inline-flex;
			align-items: center;
			font-size: 13px;
			color: #576b95;
			margin-bottom: 4px;
		}

		.post-location svg {
			width: 14px;
			height: 14px;
			margin-right: 4px;
			fill: #576b95;
		}

		/* 图片网格 */
		.post-images {
			margin-bottom: 10px;
		}

		.image-grid {
			display: grid;
			gap: 4px;
		}

		.image-grid-1 {
			grid-template-columns: 1fr;
			max-width: 70%;
		}

		.image-grid-2 {
			grid-template-columns: repeat(2, 1fr);
		}

		.image-grid-3 {
			grid-template-columns: repeat(3, 1fr);
		}

		.image-grid-4 {
			grid-template-columns: repeat(2, 1fr);
		}

		.image-grid-5,
		.image-grid-6 {
			grid-template-columns: repeat(3, 1fr);
		}

		.image-grid-7,
		.image-grid-8,
		.image-grid-9 {
			grid-template-columns: repeat(3, 1fr);
		}

		.image-item {
			aspect-ratio: 1;
			overflow: hidden;
			background-color: #f5f5f5;
			cursor: pointer;
		}

		.image-item img {
			width: 100%;
			height: 100%;
			object-fit: cover;
			transition: transform 0.2s;
		}

		.image-item:active img {
			transform: scale(0.98);
		}

		/* 操作栏 */
		.post-actions {
			display: flex;
			align-items: center;
			justify-content: space-between;
			margin-top: 0px;
			padding-top: 0px;
		}

		.post-time {
			font-size: 13px;
			color: #999;
			text-decoration: none;
		}

		.post-time:hover {
			color: #666;
		}

		.action-menu-btn {
			width: 28px;
			height: 28px;
			background-color: #f5f5f5;
			border: none;
			border-radius: 4px;
			display: flex;
			align-items: center;
			justify-content: center;
			cursor: pointer;
			position: relative;
		}

		.action-menu-btn svg {
			width: 18px;
			height: 18px;
			fill: #191919;
		}

		/* 弹出菜单 */
		.action-popup {
			position: absolute;
			right: 0;
			top: 100%;
			background-color: #4c4c4c;
			border-radius: 4px;
			display: none;
			z-index: 100;
			min-width: 160px;
			box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
		}

		.action-popup.show {
			display: flex;
		}

		.action-popup::after {
			content: "";
			position: absolute;
			top: -6px;
			right: 10px;
			width: 0;
			height: 0;
			border-left: 6px solid transparent;
			border-right: 6px solid transparent;
			border-bottom: 6px solid #4c4c4c;
		}

		.popup-item {
			flex: 1;
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 8px;
			padding: 12px 16px;
			color: white;
			font-size: 14px;
			cursor: pointer;
			white-space: nowrap;
			border-right: 1px solid rgba(255, 255, 255, 0.1);
		}

		.popup-item:last-child {
			border-right: none;
		}

		.popup-item svg {
			width: 20px;
			height: 20px;
			fill: white;
		}

		.popup-item:active {
			background-color: rgba(255, 255, 255, 0.1);
		}

		/* 评论区 */
		.like-comment-section {
			margin-top: 10px;
			background-color: #f5f5f5;
			border-radius: 4px;
			overflow: hidden;
		}

		.comments-section {
			padding: 0;
		}

		.comment-item {
			padding: 8px 12px;
			font-size: 14px;
			line-height: 1.4;
			border-bottom: 1px solid #e5e5e5;
		}

		.comment-item:last-child {
			border-bottom: none;
		}

		.comment-author {
			color: #174b73;
			font-weight: 500;
			margin-right: 4px;
		}

		.comment-text {
			color: #191919;
		}

		.comment-time {
			color: #999;
			font-size: 12px;
			margin-left: 6px;
		}

		.comment-form {
			border-top: 1px solid #e5e5e5;
			padding: 8px 12px;
		}

		.comment-form-row {
			display: flex;
			gap: 6px;
			margin-bottom: 6px;
		}

		.comment-form-row:last-child {
			margin-bottom: 0;
		}

		.comment-name,
		.comment-link,
		.comment-email,
		.comment-textarea {
			flex: 1;
			border: 1px solid #ddd;
			border-radius: 4px;
			padding: 6px 8px;
			font-size: 13px;
			outline: none;
			font-family: inherit;
			resize: none;
		}

		.comment-name:focus,
		.comment-link:focus,
		.comment-email:focus,
		.comment-textarea:focus {
			border-color: #174b73;
		}

		.comment-textarea {
			min-height: 40px;
		}

		.comment-form-actions {
			justify-content: flex-end;
		}

		.comment-submit {
			background: #174b73;
			color: white;
			border: none;
			border-radius: 4px;
			padding: 6px 14px;
			font-size: 14px;
			cursor: pointer;
			white-space: nowrap;
		}

		.comment-submit:active {
			background: #0d3552;
		}

		.comment-submit:disabled {
			opacity: 0.6;
			cursor: not-allowed;
		}

		/* 图片预览 */
		.image-preview-overlay {
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			background-color: rgba(0, 0, 0, 0.95);
			z-index: 2000;
			display: none;
			align-items: center;
			justify-content: center;
			cursor: pointer;
		}

		.image-preview-overlay.show {
			display: flex;
		}

		.image-preview-overlay img {
			max-width: 95%;
			max-height: 90vh;
			object-fit: contain;
		}

		/* 加载状态 */
		.loading-state {
			padding: 60px 20px;
			text-align: center;
			color: #999;
		}

		.loading-spinner {
			width: 32px;
			height: 32px;
			border: 3px solid #e5e5e5;
			border-top-color: #174b73;
			border-radius: 50%;
			animation: spin 0.8s linear infinite;
			margin: 0 auto 16px;
		}

		@keyframes spin {
			to { transform: rotate(360deg); }
		}

		/* 遮罩层 */
		.overlay {
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			z-index: 50;
			display: none;
		}

		.overlay.show {
			display: block;
		}

		/* Modal */
		.modal {
			display: none;
			position: fixed;
			z-index: 3000;
			left: 0;
			top: 0;
			width: 100%;
			height: 100%;
			background-color: rgba(0,0,0,0.4);
		}

		.modal-content {
			background-color: #fff;
			margin: 10% auto;
			padding: 1rem;
			border: 1px solid #888;
			width: 90%;
			max-width: 40em;
			max-height: 80vh;
			border-radius: 8px;
			display: flex;
			flex-direction: column;
		}

		.modal-header {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 1rem;
		}

		.modal-header h2 {
			margin: 0;
			color: #174b73;
		}

		.modal-header .close-btn {
			font-size: 1.5rem;
			cursor: pointer;
			color: #999;
		}

		.modal-body {
			flex: 1;
			overflow-y: auto;
			min-height: 0;
		}

		.modal-body textarea {
			width: 100%;
			height: 200px;
			padding: 0.5rem;
			margin-bottom: 1rem;
			border: 1px solid #ccc;
			border-radius: 4px;
			resize: vertical;
			box-sizing: border-box;
			font-family: inherit;
			font-size: 14px;
		}

		.modal-footer {
			display: flex;
			justify-content: flex-end;
			gap: 0.5rem;
		}

		.modal-footer button {
			padding: 0.5rem 1rem;
			border: none;
			border-radius: 4px;
			cursor: pointer;
			background-color: #ccc;
			color: #333;
			font-size: 14px;
		}

		.modal-footer .btn-post {
			background-color: #174b73;
			color: white;
		}

		/* 图片预览网格（发帖前） */
		.image-preview-grid {
			display: grid;
			gap: 6px;
			margin-bottom: 8px;
		}

		.image-preview-grid:empty {
			display: none;
		}

		.image-preview-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
		.image-preview-grid.cols-1 { grid-template-columns: repeat(3, 1fr); max-width: 60%; }
		.image-preview-grid.cols-4,
		.image-preview-grid.cols-6,
		.image-preview-grid.cols-9 { grid-template-columns: repeat(4, 1fr); }

		.add-image-btn {
			display: flex;
			align-items: center;
			justify-content: center;
			aspect-ratio: 1;
			border: 1px dashed #ccc;
			border-radius: 4px;
			cursor: pointer;
			color: #999;
			min-height: 0;
		}

		.add-image-btn:hover {
			border-color: #174b73;
			color: #174b73;
		}

		.preview-item {
			position: relative;
			aspect-ratio: 1;
			overflow: hidden;
			border-radius: 4px;
			background-color: #f5f5f5;
			min-height: 0;
		}

		.preview-item img {
			width: 100%;
			height: 100%;
			object-fit: cover;
		}

		.preview-item .remove-btn {
			position: absolute;
			top: 4px;
			right: 4px;
			width: 20px;
			height: 20px;
			background-color: rgba(0,0,0,0.5);
			border: none;
			border-radius: 50%;
			color: white;
			font-size: 14px;
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.image-count {
			font-size: 12px;
			color: #999;
			margin-bottom: 8px;
		}

		.image-count:empty {
			display: none;
		}

		.compress-option {
			/*display: flex;*/
			display: none;
			align-items: center;
			gap: 6px;
			font-size: 13px;
			color: #666;
			margin-bottom: 8px;
			user-select: none;
		}

		.compress-option input {
			margin: 0;
		}

		/* 底部安全区 */
		.safe-area-bottom {
			height: env(safe-area-inset-bottom, 20px);
		}

		@media (max-width: 414px) {
			.container {
				max-width: 100%;
			}
		}
	</style>
</head>
<body>
	<div class="container">
		<!-- 顶部导航栏 -->
		<div class="nav-bar" id="navBar">
			<a class="back-btn" href="/">
				<svg viewBox="0 0 24 24">
					<path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
				</svg>
			</a>
			<span class="title" id="navTitle">gitweets</span>
			<button class="post-btn" onclick="openModal()">
				<svg viewBox="0 0 24 24">
					<path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
				</svg>
			</button>
		</div>

		<!-- 封面区域 -->
		<div class="cover-section">
			<img class="cover-image" src="https://picsum.photos/id/1018/800/600" alt="封面">
			<div class="cover-overlay">
				<a href="/" class="cover-user-info">
					<span class="cover-username" id="coverUsername">Loading...</span>
					<div class="cover-avatar">
						<img id="coverAvatar" src="" alt="头像">
					</div>
				</a>
			</div>
		</div>

		<!-- 动态列表 -->
		<div class="posts-list" id="postsList">
			<div class="loading-state" id="loadingState">
				<div class="loading-spinner"></div>
				<div>正在加载...</div>
			</div>
		</div>

		<!-- 分页指示器 -->
		<div class="pagination-indicator" id="paginationIndicator" style="display:none;">
			<button class="page-btn" id="btnPrev" disabled onclick="goPrevPage()">◀</button>
			<span class="page-info" id="pageInfo" onclick="refreshCurrentPage()">-</span>
			<button class="page-btn" id="btnNext" disabled onclick="goNextPage()">▶</button>
		</div>

		<!-- 图片预览 -->
		<div class="image-preview-overlay" id="imagePreview">
			<img src="" alt="预览图片" id="previewImage">
		</div>

		<!-- 遮罩层 -->
		<div class="overlay" id="overlay"></div>

		<div class="safe-area-bottom"></div>
	</div>

	<!-- Modal for composing tweet -->
	<div id="composeModal" class="modal">
		<div class="modal-content">
			<div class="modal-header">
				<h2>发推</h2>
				<span class="close-btn" onclick="closeModal()">&times;</span>
			</div>
			<div class="modal-body">
				<textarea id="inputTweet" placeholder="内容以 : 结尾可显示图片"></textarea>
				<div class="image-preview-grid" id="imagePreviewGrid">
					<!-- 图片预览和 + 按钮将在这里动态添加 -->
				</div>
				<label class="compress-option">
					<input type="checkbox" id="clientCompress" checked> 浏览器压图
				</label>
				<div class="image-count" id="imageCount"></div>
			</div>
			<div class="modal-footer">
				<button onclick="closeModal()">取消</button>
				<button class="btn-post" id="btnPost">发送</button>
			</div>
		</div>
	</div>

	<script>
		const sh = s => s.replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;');
		const linkify = s => s.replace(/(https?:\/\/[^\s<>"']+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');

		const foldPost = (s, limit = 250) => {
			if (new TextEncoder().encode(s).length <= limit) return linkify(sh(s));
			const cut = s.lastIndexOf('\n', limit);
			const head = s.slice(0, cut > 0 ? cut : limit);
			const tail = s.slice(cut > 0 ? cut + 1 : limit);
			return `${linkify(sh(head))} <details class="post-fold"><summary>...</summary>${linkify(sh(tail))}</details>`;
		};

		function formatDate(d) {
			return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
		}
		const isSameDay = (a, b) => a.toDateString() === b.toDateString();

		function relativeTime(input) {
			const d = typeof input === 'number' ? new Date(input * 1000) : input;
			const diff = Date.now() - d;
			if (diff < 60000) return '刚刚';
			if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
			if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
			if (diff < 604800000) return Math.floor(diff / 86400000) + '天前';
			if (typeof input === 'number') return `${d.getMonth() + 1}月${d.getDate()}日`;
			if (diff < 2592000000) return Math.floor(diff / 604800000) + '周前';
			if (diff < 31536000000) return Math.floor(diff / 2592000000) + '个月前';
			return Math.floor(diff / 31536000000) + '年前';
		}
		const timeAgo = relativeTime;
		const formatTime = relativeTime;

		let REPO = '';
		let API_BASE = '';
		let currentPage = 0;
		let loadedBuffer = [];
		let displayedPages = [];
		let isLoading = false;
		let repoOwnerInfo = null;

		const PATH_RE = /^\/(\w+)(?:\/([0-9a-fA-F]{7,40}))?$/;
		const pathMatch = () => PATH_RE.exec(location.pathname);
		const $ = id => document.getElementById(id);
		const composeModal = $('composeModal');
		const navBar = $('navBar');
		const overlay = $('overlay');
		const imagePreview = $('imagePreview');
		const previewImage = $('previewImage');
		const inputTweet = $('inputTweet');
		const btnPost = $('btnPost');

		function parseUrl() {
			const m = pathMatch();
			if (m) REPO = 'est/gitweets';
			else REPO = new URLSearchParams(location.search).get('repo') || 'est/gitweets';
			API_BASE = `https://api.github.com/repos/${REPO}`;
		}

		async function loadOwnerInfo() {
			try {
				const { owner } = await (await fetch(API_BASE)).json();
				repoOwnerInfo = owner;
				$('coverUsername').textContent = owner.login;
				$('coverAvatar').src = owner.avatar_url;
				$('navTitle').textContent = REPO.split('/')[1] || 'gitweets';
			} catch (e) {
				console.error('Failed to load owner info:', e);
				$('coverUsername').textContent = REPO;
			}
		}

		async function fetchCommits(untilDate) {
			const m = pathMatch();
			if (m?.[2]) return [(await (await fetch(`${API_BASE}/commits/${m[2]}`)).json())];
			const params = new URLSearchParams({ per_page: 100 });
			if (untilDate) params.set('until', untilDate.toISOString());
			if (m?.[1]) params.set('author', m[1]);
			return (await fetch(`${API_BASE}/commits?${params}`)).json();
		}

		function findDateBoundary(commits) {
			if (commits.length <= 1) return commits.length;
			const first = new Date(commits[0].commit.author.date);
			for (let i = 20; i < commits.length; i++) {
				if (!isSameDay(first, new Date(commits[i].commit.author.date))) return i;
			}
			return commits.length;
		}

		async function loadPage(pageIndex) {
			if (isLoading) return;
			isLoading = true;
			const postsList = $('postsList');
			const loadingState = $('loadingState');
			loadingState.style.display = 'block';
			postsList.querySelectorAll(':scope .post-item').forEach(el => el.remove());
			try {
				if (pageIndex >= 0 && pageIndex < displayedPages.length) {
					await renderPage(displayedPages[pageIndex].commits);
					updatePagination(pageIndex);
					loadingState.style.display = 'none';
					return;
				}
				if (pageIndex === 0 && displayedPages.length === 0) {
					const commits = await fetchCommits(null);
					if (!commits?.length) { loadingState.innerHTML = '<div>没有数据</div>'; return; }
					await processAndDisplay(commits, pageIndex);
				} else if (pageIndex === displayedPages.length) {
					if (loadedBuffer.length === 0) {
						const last = displayedPages[displayedPages.length - 1].commits.at(-1);
						const untilDate = new Date(last.commit.author.date);
						untilDate.setHours(0, 0, 0, 0);
						const commits = await fetchCommits(untilDate);
						if (!commits?.length) { loadingState.innerHTML = '<div>没有更多数据了</div>'; return; }
						const idx = commits.findIndex(c => c.sha === last.sha);
						loadedBuffer = idx >= 0 ? commits.slice(idx + 1) : commits;
					}
					if (loadedBuffer.length === 0) { loadingState.innerHTML = '<div>没有更多数据了</div>'; return; }
					await processAndDisplay(loadedBuffer, pageIndex);
				}
				loadingState.style.display = 'none';
			} catch (e) {
				console.error('Failed to load page:', e);
				loadingState.innerHTML = '<div>加载失败，请重试</div>';
			} finally { isLoading = false; }
		}

		async function processAndDisplay(commits, pageIndex) {
			const boundary = findDateBoundary(commits);
			const pageCommits = commits.slice(0, boundary);
			loadedBuffer = commits.slice(boundary);
			displayedPages.push({
				commits: pageCommits,
				startDate: new Date(pageCommits.at(-1).commit.author.date),
				endDate: new Date(pageCommits[0].commit.author.date)
			});
			await renderPage(pageCommits);
			updatePagination(pageIndex);
		}

		async function renderPage(commits) {
			const postsList = $('postsList');
			const mediaIds = [];
			for (const item of commits) {
				postsList.insertAdjacentHTML('beforeend', renderPost(item));
				if (/(：|:)\s*$/.test(item.commit.message.trim())) mediaIds.push(item.sha);
			}
			mediaIds.forEach(async id => {
				try {
					const item = commits.find(c => c.sha === id);
					if (item?.files) appendImages(id, item.files);
					else appendImages(id, (await (await fetch(`${API_BASE}/commits/${id}`)).json()).files);
				} catch (e) { console.error('Failed to load images for commit', id, e); }
			});
			loadInteractions(commits.map(c => c.sha));
		}

		async function loadInteractions(commitShas) {
			if (!commitShas.length) return;
			try {
				const resp = await fetch(`/.cmts?repo=${encodeURIComponent(REPO)}&shas=${commitShas.join(',')}`);
				if (!resp.ok) return;
				const data = await resp.json();
				for (const [sha, d] of Object.entries(data)) {
					if (d.comments?.length) renderInteractionComments(sha, d.comments);
				}
			} catch {}
		}

		// 渲染评论列表
		function renderInteractionComments(sha, comments) {
			const postEl = $(`post-${sha}`);
			if (!postEl) return;
			const section = postEl.querySelector('.like-comment-section');
			const commentsSection = section.querySelector('.comments-section');
			commentsSection.innerHTML = comments.map(c => renderCommentItem(c)).join('');
			commentsSection.style.display = 'block';
			section.style.display = 'block';
		}

		function appendImages(sha, files) {
			if (!files?.length) return;
			const images = [];
			for (const f of files) {
				const m = /\/(?:static|uploads)%2F(.+\.(webp|jpg|jpeg|png|gif|jxl|avif))$/i.exec(f.raw_url || f.filename || '');
				if (m) images.push(`https://raw.githubusercontent.com/${REPO}/${sha}/uploads/${decodeURIComponent(m[1])}`);
			}
			if (!images.length) return;
			const postEl = $(`post-${sha}`);
			const contentEl = postEl?.querySelector('.post-content');
			if (!postEl || !contentEl) return;
			const gridItems = images.slice(0, 9).map(src => `<div class="image-item" data-src="${src}"><img src="${src}" alt="图片" loading="lazy"></div>`).join('');
			contentEl.insertAdjacentHTML('afterend', `<div class="post-images"><div class="image-grid image-grid-${Math.min(images.length, 9)}">${gridItems}</div></div>`);
		}

		// Update pagination controls
		function updatePagination(pageIndex) {
			currentPage = pageIndex;
			const indicator = $('paginationIndicator');
			const pageInfo = $('pageInfo');
			const btnPrev = $('btnPrev');
			const btnNext = $('btnNext');

			indicator.style.display = 'flex';

			if (displayedPages[pageIndex]) {
				const page = displayedPages[pageIndex];
				const start = formatDate(page.startDate);
				const end = formatDate(page.endDate);
				pageInfo.textContent = start === end ? start : `${start} ~ ${end}`;
			}

			btnPrev.disabled = pageIndex === 0;
			// Always allow next - will show "no more data" if needed
			btnNext.disabled = false;
		}

		function renderPost(item) {
			const date = new Date(item.commit.author.date);
			const authorName = item.commit.author.name;
			const authorAvatar = item.author?.avatar_url || '';
			const authorSlug = item.author?.login || '';
			return `
				<div class="post-item" id="post-${item.sha}" data-sha="${item.sha}">
					<div class="post-header">
						<div class="post-avatar"><a href="/"><img src="${encodeURI(authorAvatar)}" alt="头像"></a></div>
						<div class="post-meta"><div class="post-username"><a href="/${encodeURI(authorSlug)}" style="color:inherit;text-decoration:none">${sh(authorName)}</a>${item.commit.verification?.verified ? ' <span style="color:blue">✓</span>' : ''}</div></div>
					</div>
					<div class="post-content">${foldPost(item.commit.message)}</div>
					<div class="post-actions">
						<a href="/${encodeURI(authorSlug)}/${item.sha.slice(0, 7)}" class="post-time" title="${new Intl.DateTimeFormat('zh-CN', { dateStyle: 'long', timeStyle: 'medium' }).format(date)}">${timeAgo(date)}</a>
						<button class="action-menu-btn" onclick="toggleMenu(this)">
							<svg viewBox="0 0 24 24">
								<circle cx="12" cy="6" r="2"/>
								<circle cx="12" cy="12" r="2"/>
								<circle cx="12" cy="18" r="2"/>
							</svg>
							<div class="action-popup">
								<div class="popup-item" onclick="handleComment(event, '${item.sha}')">
									<svg viewBox="0 0 24 24"><path d="M21 6h-2v9H6v2c0 .55.45 1 1 1h11l4 4V7c0-.55-.45-1-1-1zm-4 6V3c0-.55-.45-1-1-1H3c-.55 0-1 .45-1 1v14l4-4h10c.55 0 1-.45 1-1z"/></svg>
									<span>评论</span>
								</div>
							</div>
						</button>
					</div>
					<div class="like-comment-section"><div class="comments-section" style="display:none"></div></div>
				</div>
			`;
		}

		function closeAllMenus() {
			document.querySelectorAll('.action-popup').forEach(p => p.classList.remove('show'));
			overlay.classList.remove('show');
		}
		window.toggleMenu = function(btn) {
			const popup = btn.querySelector('.action-popup');
			const isOpen = popup.classList.contains('show');
			closeAllMenus();
			if (!isOpen) { popup.classList.add('show'); overlay.classList.add('show'); }
		};

		window.handleComment = function(event, sha) {
			event.stopPropagation();
			closeAllMenus();
			const postEl = $(`post-${sha}`);
			if (!postEl) return;
			const section = postEl.querySelector('.like-comment-section');
			const commentsSection = section.querySelector('.comments-section');
			section.style.display = 'block';
			commentsSection.style.display = 'block';

			// 如果已有表单则聚焦
			if (commentsSection.querySelector('.comment-form')) {
				commentsSection.querySelector('.comment-name').focus();
				return;
			}

			// 读取本地存储的名字
			const savedName = localStorage.getItem('cmt_name') || '';
			const savedLink = localStorage.getItem('cmt_link') || '';
			const savedEmail = localStorage.getItem('cmt_email') || '';

			const formHtml = `
				<div class="comment-form">
					<div class="comment-form-row">
						<input class="comment-name" placeholder="名字 *" maxlength="50" value="${sh(savedName)}">
						<input class="comment-link" placeholder="链接 (可选)" maxlength="200" value="${sh(savedLink)}">
					</div>
					<div class="comment-form-row">
						<input class="comment-email" placeholder="邮箱 (可选)" maxlength="100" value="${sh(savedEmail)}">
					</div>
					<div class="comment-form-row">
						<textarea class="comment-textarea" placeholder="写评论..." maxlength="500" rows="2"></textarea>
					</div>
					<div class="comment-form-row comment-form-actions">
						<button class="comment-submit" onclick="submitComment('${sha}')">发送</button>
					</div>
				</div>
			`;
			commentsSection.insertAdjacentHTML('beforeend', formHtml);
			commentsSection.querySelector('.comment-name').focus();
		};

		window.submitComment = async function(sha) {
			const postEl = $(`post-${sha}`);
			const form = postEl?.querySelector('.comment-form');
			if (!form) return;
			const name = form.querySelector('.comment-name').value.trim();
			const text = form.querySelector('.comment-textarea').value.trim();
			const link = form.querySelector('.comment-link').value.trim();
			const email = form.querySelector('.comment-email').value.trim();
			if (!name) { alert('请填写名字'); form.querySelector('.comment-name').focus(); return; }
			if (!text) { alert('请填写评论内容'); form.querySelector('.comment-textarea').focus(); return; }
			localStorage.setItem('cmt_name', name);
			if (link) localStorage.setItem('cmt_link', link);
			if (email) localStorage.setItem('cmt_email', email);
			const btn = form.querySelector('.comment-submit');
			btn.disabled = true;
			btn.textContent = '发送中...';
			try {
				const resp = await fetch(`/.cmts?id=${sha}`, {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ name, text, link, email }),
				});
				const data = await resp.json();
				if (resp.ok && data.success) {
					form.insertAdjacentHTML('beforebegin', renderCommentItem(data.comment));
					form.querySelector('.comment-textarea').value = '';
				} else alert(data.error || '评论失败');
			} catch { alert('网络错误'); }
			finally { btn.disabled = false; btn.textContent = '发送'; }
		};

		function renderCommentItem(c) {
			const nameHtml = c.link
				? `<a class="comment-author" href="${sh(c.link)}" target="_blank" rel="noopener nofollow ugc">${sh(c.name)}</a>`
				: `<span class="comment-author">${sh(c.name)}</span>`;
			return `<div class="comment-item">${nameHtml} <span class="comment-text">${sh(c.text)}</span> <span class="comment-time">${formatTime(c.ts)}</span></div>`;
		}

		overlay.addEventListener('click', closeAllMenus);

		document.addEventListener('click', e => {
			const imageItem = e.target.closest('.image-item');
			if (imageItem) { previewImage.src = imageItem.dataset.src; imagePreview.classList.add('show'); }
			if (e.target === imagePreview) imagePreview.classList.remove('show');
		});

		window.goPrevPage = () => { if (currentPage > 0) { loadPage(currentPage - 1); scrollTo(0, 0); } };
		window.goNextPage = () => { loadPage(currentPage + 1); scrollTo(0, 0); };
		window.refreshCurrentPage = () => { loadPage(currentPage); scrollTo(0, 0); };

		addEventListener('scroll', () => navBar.classList.toggle('scrolled', scrollY > 200));

		function getOAuthUrl() {
			const state = crypto.randomUUID();
			document.cookie = `oauth_state=${state}; Path=/; Secure; SameSite=Strict; Max-Age=600`;
			return `https://github.com/login/oauth/authorize?scope=public_repo&client_id=Ov23lirVyDKVPnHhDOFw&state=${state}`;
		}
		const getCookie = (str, name) => decodeURIComponent(str || '').split(';').find(r => r.trim().startsWith(name + '='))?.split('=')[1]?.trim() || '';

		function openModal() {
			if (getCookie(document.cookie, 'logged_in')) {
				btnPost.innerText = '发送';
				inputTweet.disabled = false;
				inputTweet.placeholder = '内容以 : 结尾可显示图片';
				updateImagePreview();
			} else {
				inputTweet.value = '';
				inputTweet.placeholder = 'Login and make a tweet via Github REST API.\n\nOr you can post a tweet locally, clone the repo and\ngit commit --allow-empty && git push\n\nThis OAuth login will save an access_token into your browser cookie\nThe default and minimal required scope is public_repo\n';
				inputTweet.disabled = true;
				btnPost.innerText = 'Login';
			}
			composeModal.style.display = 'block';
		}
		function closeModal(skipConfirm) {
			if (!skipConfirm && (inputTweet.value.trim() || selectedImages.length) && !confirm('内容尚未发布，确定关闭吗？')) return;
			inputTweet.value = '';
			inputTweet.placeholder = "What's up?";
			composeModal.style.display = 'none';
			clearSelectedImages();
		}
		function clearSelectedImages() {
			selectedImages.forEach(img => URL.revokeObjectURL(img.url));
			selectedImages = [];
			updateImagePreview();
		}

		let selectedImages = [];
		const MAX_IMAGES = 9;
		const MAX_FILE_SIZE = 5 * 1024 * 1024;

		const imagePreviewGrid = $('imagePreviewGrid');
		const imageCount = $('imageCount');
		const clientCompressCheckbox = $('clientCompress');

		async function prepareImageFile(file) {
			let processed = file;
			if (clientCompressCheckbox.checked) {
				const { compressImage } = await import('/static/compress-image.js');
				processed = await compressImage(file);
			}
			const url = URL.createObjectURL(processed);
			let filename = generateFilename(file);
			if (processed.type !== file.type) {
				filename = filename.replace(/\.[^.]+$/, '.' + processed.type.split('/')[1]);
			}
			return { file: processed, url, filename };
		}
		const fileInput = Object.assign(document.createElement('input'), { type: 'file', accept: 'image/*', multiple: true });
		fileInput.style.display = 'none';
		document.body.appendChild(fileInput);

		function generateFilename(file) {
			const now = new Date();
			const mm = String(now.getMonth() + 1).padStart(2, '0');
			const dd = String(now.getDate()).padStart(2, '0');
			const seq = String(selectedImages.length + 1).padStart(3, '0');
			return `${mm}${dd}-${seq}.${(file.name.split('.').pop() || 'jpg')}`;
		}

		async function addImageFiles(files) {
			if (!files.length) return;
			const remaining = MAX_IMAGES - selectedImages.length;
			if (remaining <= 0) { alert(`最多选择 ${MAX_IMAGES} 张图片`); return false; }
			let added = 0;
			for (const file of files) {
				if (added >= remaining) break;
				if (!file.type.startsWith('image/')) { alert(`${file.name} 不是图片文件`); continue; }
				if (file.size > MAX_FILE_SIZE) { alert(`${file.name} 超过 5MB 限制`); continue; }
				selectedImages.push(await prepareImageFile(file));
				added++;
			}
			if (files.length > remaining) alert(`已达上限，只添加了前 ${remaining} 张`);
			updateImagePreview();
			return true;
		}

		fileInput.addEventListener('change', async e => {
			const files = Array.from(e.target.files);
			await addImageFiles(files);
			fileInput.value = '';
		});

		function triggerFileSelect() { fileInput.click(); }
		function removeImage(index) {
			URL.revokeObjectURL(selectedImages[index].url);
			selectedImages.splice(index, 1);
			updateImagePreview();
		}
		window.removeImage = removeImage;
		window.triggerFileSelect = triggerFileSelect;

		inputTweet.addEventListener('paste', async e => {
			const items = Array.from(e.clipboardData?.items || []).filter(i => i.type.startsWith('image/'));
			if (!items.length) return;
			e.preventDefault();
			const remaining = MAX_IMAGES - selectedImages.length;
			if (remaining <= 0) { alert(`最多选择 ${MAX_IMAGES} 张图片`); return; }
			let added = 0;
			for (const item of items) {
				if (added >= remaining) break;
				const file = item.getAsFile();
				if (!file) continue;
				selectedImages.push(await prepareImageFile(file));
				added++;
			}
			if (items.length > remaining) alert(`已达上限，只添加了前 ${remaining} 张`);
			updateImagePreview();
		});

		function makeAddBtn() {
			const btn = document.createElement('div');
			btn.id = 'addImageBtn';
			btn.className = 'add-image-btn';
			btn.onclick = triggerFileSelect;
			btn.innerHTML = '<svg viewBox="0 0 24 24" width="20" height="20"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>';
			return btn;
		}
		function updateImagePreview() {
			const count = selectedImages.length;
			imagePreviewGrid.innerHTML = '';
			imagePreviewGrid.className = 'image-preview-grid';
			if (count === 0) {
				imageCount.textContent = '';
				imagePreviewGrid.classList.add('cols-1');
				imagePreviewGrid.appendChild(makeAddBtn());
				return;
			}
			const colClass = count === 1 ? 'cols-1' : count === 2 ? 'cols-2' : count === 3 ? 'cols-3' : count === 4 ? 'cols-4' : count <= 6 ? 'cols-6' : 'cols-9';
			imagePreviewGrid.classList.add(colClass);
			selectedImages.forEach((img, index) => {
				const item = document.createElement('div');
				item.className = 'preview-item';
				item.innerHTML = `<img src="${img.url}" alt="预览"><button class="remove-btn" onclick="removeImage(${index})">&times;</button>`;
				imagePreviewGrid.appendChild(item);
			});
			if (count < MAX_IMAGES) imagePreviewGrid.appendChild(makeAddBtn());
			imageCount.textContent = `${count}/${MAX_IMAGES}`;
		}

		addEventListener('click', e => { if (e.target === composeModal) closeModal(); });
		addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

		btnPost.addEventListener('click', async () => {
			const text = inputTweet.value.trim();
			if (!getCookie(document.cookie, 'logged_in')) { location.href = getOAuthUrl(); return; }
			if (!selectedImages.length && !text) { inputTweet.placeholder = 'Type something here!'; return; }
			btnPost.innerText = '发送中...';
			btnPost.disabled = true;
			try {
				const formData = new FormData();
				formData.append('repo', REPO);
				formData.append('message', text);
				formData.append('client_compress', clientCompressCheckbox.checked ? '1' : '0');
				for (const img of selectedImages) formData.append('images', img.file, img.filename);
				const result = await (await fetch('/.new_post', { method: 'POST', credentials: 'include', body: formData })).json();
				if (result.error) throw new Error(result.error);
				closeModal(true);
				displayedPages = [];
				loadedBuffer = [];
				currentPage = 0;
				loadPage(0);
			} catch (e) { alert('发送失败: ' + e.message); }
			finally { btnPost.innerText = '发送'; btnPost.disabled = false; }
		});

		const modalContent = document.querySelector('.modal-content');
		modalContent.addEventListener('dragover', e => { e.preventDefault(); e.stopPropagation(); modalContent.style.borderColor = '#174b73'; });
		modalContent.addEventListener('dragleave', e => { e.preventDefault(); e.stopPropagation(); modalContent.style.borderColor = ''; });
		modalContent.addEventListener('drop', e => {
			e.preventDefault(); e.stopPropagation(); modalContent.style.borderColor = '';
			const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
			if (files.length) (async () => { for (const f of files) { if (selectedImages.length >= MAX_IMAGES) break; if (f.size > MAX_FILE_SIZE) { alert(`${f.name} 超过 5MB 限制`); continue; } selectedImages.push(await prepareImageFile(f)); } updateImagePreview(); })();
		});

		document.addEventListener('DOMContentLoaded', () => { parseUrl(); loadOwnerInfo(); loadPage(0); updateImagePreview(); });
	</script>
</body>
</html>
